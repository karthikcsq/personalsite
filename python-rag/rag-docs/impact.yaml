# What my work says about me now, most representative first.
#
# The chat reads this on every question. A broad question ("who is Karthik?",
# "what's his best work?") frames me around `focus` and builds its answer from
# the top tiers instead of from whatever vector search happened to match. A
# focused question uses it only to choose between equally relevant items.
#
# Private: the site never renders this file, and create-pinecone.py ignores
# these keys, so nothing here is embedded. Reorder freely. Order inside a tier
# is rank order.
#
# Tiers:
#   flagship    lead any broad answer about me
#   strong      supports a broad answer
#   supporting  featured only when the question points at it
#   early       featured only when someone asks about it or that era
#
# `id` must match the chat's artifact id: work:<company in the truth YAML>,
# project:<id in src/data/projects.json>, involvement:<slug in involvement.yaml>.
# Every work, project, and involvement entry must appear exactly once; a test
# enforces it. `focus` and `why` are stated as fact in answers, so keep them to
# things that are true.

focus: "These days Karthik's work centers on agent systems and memory."

impact:
  - tier: flagship
    entries:
      - id: "work:Samsung Research America"
        why: "Co-architected Samsung's always-on AI agent orchestrator, owning half of a 25+ module runtime that ships on XR glasses, including the agent's long-term memory, model routing, and safety layers."
      - id: "work:Memories.ai"
        why: "His first startup role, doing real computer vision research: built a memory framework that lets vision language models work over hours-long video, indexing 10K+ streams for multimodal search."
      - id: "project:parm"
        why: "Built PARM, a causal benchmark for whether an AI agent uses personal memory only once a late tool result makes it relevant, with 157 frozen scenarios and 471 executable cases; on its development suite, PARM's retrieval policy made 30 of 36 correct decisions against 18 for the strongest baselines."
      - id: "project:google-tools-mcp"
        why: "Open-source MCP server on npm that lets agents operate an entire Google Workspace, with 169 tools behind a single OAuth flow."
      - id: "involvement:buildpurdue"
        why: "Co-founded and co-leads buildpurdue, a founder-led community for student builders at Purdue supporting 15 student startups with partnerships across 4 VC firms, and led the build of its operating platform."
      - id: "work:Peraton Labs"
        why: "Built a first-of-its-kind reinforcement learning agent for IoT malware detection in a classified defense research environment, raising detection coverage 25% across 500K+ daily device events."

